services:
  db:
    image: postgres:16
    container_name: onlystudent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onlystudent}
      POSTGRES_USER: ${POSTGRES_USER:-onlystudent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onlystudent-local-dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - onlystudent-pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-onlystudent}
      DB_USERNAME: ${POSTGRES_USER:-onlystudent}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-onlystudent-local-dev}
      JWT_SECRET: ${JWT_SECRET:-onlystudent-local-dev-jwt-secret-not-for-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      PORT: 8082
      SPRING_MAIL_HOST:
      SPRING_MAIL_PORT:
      SPRING_MAIL_USERNAME:
      SPRING_MAIL_PASSWORD:
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  onlystudent-pgdata:
